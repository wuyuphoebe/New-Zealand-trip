<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紐西蘭 11 天之旅 - 互動編輯行程表</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        nzblue: '#1e3a8a',
                        nzgreen: '#047857',
                        nzgold: '#d97706',
                    }
                }
            }
        }
    </script>
    <style>

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .bg-pattern { background-color: #f8fafc; background-image: radial-gradient(#cbd5e1 0.75px, transparent 0.75px); background-size: 16px 16px; }

</head>
<body class="bg-pattern text-slate-800 min-h-screen pb-24">

    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-30 bg-slate-900/95 text-white backdrop-blur-md border-b border-slate-800 shadow-lg transition-all">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white text-xl font-black shadow-md">
                    🇳🇿
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-100 flex items-center gap-2">
                        紐西蘭 11 天自由行
                    </h1>
                    <p class="text-xs text-slate-400 flex items-center gap-2">
                        <span id="current-mode-badge" class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span id="header-subtitle">瀏覽模式 (唯讀)</span>
                    </p>
                </div>
            </div>

            <!-- Header Action Controls -->
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Mode Toggle -->
                <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700">
                    <button id="btn-view-mode" onclick="setEditMode(false)" class="px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-white bg-slate-700 shadow-sm flex items-center gap-1">
                        <i class="fa-solid fa-eye"></i> <span class="hidden sm:inline">瀏覽</span>
                    </button>
                    <button id="btn-edit-mode" onclick="setEditMode(true)" class="px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-slate-400 hover:text-white flex items-center gap-1">
                        <i class="fa-solid fa-pen-to-square"></i> <span class="hidden sm:inline">編輯 CMS</span>
                    </button>
                </div>

                <!-- Backup Options Dropdown Button -->
                <button onclick="toggleDataMenu()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition-all text-sm relative" title="資料備份與重置">
                    <i class="fa-solid fa-sliders"></i>
                </button>

                <!-- Data Menu Popover -->
                <div id="data-menu" class="hidden absolute right-4 top-14 bg-white text-slate-800 rounded-2xl shadow-2xl border border-slate-200 p-3 w-56 z-50 animate-in fade-in slide-in-from-top-2 duration-200">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider px-2 py-1">資料管理 (CMS)</div>
                    <button onclick="exportJSON(); toggleDataMenu()" class="w-full text-left px-3 py-2 text-xs font-medium rounded-xl hover:bg-slate-100 flex items-center gap-2 text-slate-700">
                        <i class="fa-solid fa-file-export text-teal-600"></i> 匯出行程 JSON 檔案
                    </button>
                    <label class="w-full text-left px-3 py-2 text-xs font-medium rounded-xl hover:bg-slate-100 flex items-center gap-2 text-slate-700 cursor-pointer">
                        <i class="fa-solid fa-file-import text-blue-600"></i> 匯入行程 JSON 檔案
                        <input type="file" id="import-file" accept=".json" class="hidden" onchange="importJSON(event)">
                    </label>
                    <hr class="my-1 border-slate-100">
                    <button onclick="resetData(); toggleDataMenu()" class="w-full text-left px-3 py-2 text-xs font-medium rounded-xl hover:bg-rose-50 text-rose-600 flex items-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i> 重置為預設行程
                    </button>
                </div>
            </div>
        </div>

        <!-- Horizontal Scrollable Day Switcher -->
        <div class="bg-slate-900 border-t border-slate-800 px-2 py-2">
            <div class="max-w-4xl mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 px-2" id="day-tabs-container">
                <!-- Day Tabs dynamically populated -->
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 mt-4 space-y-4">

        <!-- Trip Overview Stats Box -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
            <div class="flex items-center justify-between mb-3 border-b border-slate-100 pb-2">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-emerald-600"></i>
                    <h2 class="text-sm font-bold text-slate-700" id="current-day-title">Day 1 行程概覽</h2>
                </div>
                <div id="day-cost-estimate" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                    預估開銷: -- NZD
                </div>
            </div>

            <!-- Dynamic Summary Badges -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                    <span class="text-slate-400 block text-[10px] mb-0.5">總日數</span>
                    <span id="stat-total-days" class="font-black text-slate-800 text-sm">11 天</span>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                    <span class="text-slate-400 block text-[10px] mb-0.5">當日行程數</span>
                    <span id="stat-activities-count" class="font-black text-slate-800 text-sm">0 個項目</span>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                    <span class="text-slate-400 block text-[10px] mb-0.5">住宿地點</span>
                    <span id="stat-lodging" class="font-black text-emerald-600 text-sm truncate block">未定</span>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                    <span class="text-slate-400 block text-[10px] mb-0.5">預估車程/距離</span>
                    <span id="stat-drive-time" class="font-black text-indigo-600 text-sm truncate block">約 -- km</span>
                </div>
            </div>

            <!-- Filter Categories (View Mode only) -->
            <div id="category-filter-container" class="flex items-center gap-1.5 mt-3 pt-3 border-t border-slate-100 overflow-x-auto no-scrollbar">
                <span class="text-xs text-slate-400 font-medium whitespace-nowrap mr-1">篩選:</span>
                <button onclick="setCategoryFilter('all')" class="cat-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-800 text-white shadow-sm transition-all whitespace-nowrap" data-cat="all">全部</button>
                <button onclick="setCategoryFilter('景點')" class="cat-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap" data-cat="景點">🏔 景點</button>
                <button onclick="setCategoryFilter('美食')" class="cat-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap" data-cat="美食">🍽 美食</button>
                <button onclick="setCategoryFilter('交通')" class="cat-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap" data-cat="交通">🚗 交通</button>
                <button onclick="setCategoryFilter('住宿')" class="cat-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap" data-cat="住宿">🏨 住宿</button>
            </div>
        </section>

        <div id="edit-day-controls" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase text-amber-800 tracking-wider flex items-center gap-1">
                    <i class="fa-solid fa-pen-clip"></i> 天數編輯區 (Day CMS)
                </span>
                <button onclick="deleteCurrentDay()" class="text-xs text-rose-600 hover:text-rose-800 font-medium px-2 py-1 rounded-lg hover:bg-rose-100/50">

                </button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1 font-medium">住宿名稱/地點 (Lodging)</label>
                    <input type="text" id="edit-day-hotel-input" oninput="updateDayMetadata()" class="w-full text-sm p-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="例如：Tekapo Lakefront Resort">
                </div>
            </div>
        </div>

        <!-- Timeline Container -->
        <section id="timeline-container" class="relative pl-3 sm:pl-6 space-y-6">
            <!-- Dynamic Items Injection -->
        </section>

        <!-- Add Activity Button (Visible in Edit Mode or Bottom) -->
        <div id="add-item-bar" class="hidden pt-4 pb-8 text-center">
            <button onclick="addNewActivity()" class="w-full py-3.5 border-2 border-dashed border-emerald-400 bg-emerald-50/50 hover:bg-emerald-100/50 text-emerald-700 font-bold text-sm rounded-2xl flex items-center justify-center gap-2 transition-all shadow-sm">

        </div>

        <i class="fa-solid fa-plus"></i>
    </button>

    <div id="phrase-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-6 relative border border-slate-100 animate-in zoom-in-95 duration-200">

            <div class="flex items-center justify-between border-b border-slate-100 pb-3">

                <button onclick="closePhraseModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center">

            </div>

            <p class="text-[11px] text-center text-slate-400">點擊朗讀可直接發音給租車處、飯店櫃檯或海關聽</p>

        // App State
        let itineraryData = null;
        let currentDayIndex = 0;
        let isEditMode = false;
        let activeCategoryFilter = 'all';

        // LocalStorage Key
        const STORAGE_KEY = 'NZ_TRAVEL_ITINERARY_CMS_DATA';

        // Initialization
        window.onload = function() {
            loadData();
            renderApp();
        };

        // Load data from LocalStorage or default
        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    itineraryData = JSON.parse(saved);
                } else {
                    itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
                }
            } catch (e) {
                console.error("Failed to parse stored itinerary data:", e);
                itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
            }
        }

        // Save data to LocalStorage
        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(itineraryData));
            } catch (e) {
                showToast("儲存失敗：空間可能已滿", true);
            }
        }

        // Reset to Default Data
        function resetData() {
            if (confirm("確定要重置所有行程嗎？您自己修改的內容將會被回復為預設值。")) {
                itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
                currentDayIndex = 0;
                saveData();
                renderApp();
                showToast("已成功重置為預設 11 天行程！");
            }
        }

        // Main Render Loop
        function renderApp() {
            renderDayTabs();
            renderDayHeader();
            renderTimeline();
            updateModeUI();
        }

        // Render Top Day Selector Tabs
        function renderDayTabs() {
            const container = document.getElementById('day-tabs-container');
            container.innerHTML = '';

            itineraryData.days.forEach((day, index) => {
                const isActive = index === currentDayIndex;
                const btn = document.createElement('button');
                btn.onclick = () => {
                    currentDayIndex = index;
                    renderApp();
                };
                btn.className = `px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all flex items-center gap-1.5 ${
                    isActive 
                        ? 'bg-emerald-500 text-white shadow-md shadow-emerald-500/30' 
                        : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`;
                btn.innerHTML = `<span>Day ${day.dayNum}</span>`;
                container.appendChild(btn);
            });

            // If in Edit Mode, append an "+ Add Day" button
            if (isEditMode) {
                const addDayBtn = document.createElement('button');
                addDayBtn.onclick = addNewDay;
                addDayBtn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 transition-all flex items-center gap-1';
                addDayBtn.innerHTML = `<i class="fa-solid fa-plus"></i> 加天數`;
                container.appendChild(addDayBtn);
            }
        }

        // Render Day Stats and Info Overview
        function renderDayHeader() {
            if (!itineraryData.days[currentDayIndex]) {
                currentDayIndex = 0;
            }
            const currentDay = itineraryData.days[currentDayIndex];

            document.getElementById('current-day-title').innerText = `Day ${currentDay.dayNum}: ${currentDay.title || '自訂行程'}`;
            document.getElementById('stat-total-days').innerText = `${itineraryData.days.length} 天`;
            document.getElementById('stat-activities-count').innerText = `${currentDay.items.length} 個項目`;
            document.getElementById('stat-lodging').innerText = currentDay.lodging || '未指定住宿';

            // Calculate estimated costs
            const totalCost = currentDay.items.reduce((sum, item) => sum + (parseFloat(item.estCost) || 0), 0);
            document.getElementById('day-cost-estimate').innerText = `當日開銷: ~$${totalCost} NZD`;

            // Calculate drive estimate badge
            const driveItemsCount = currentDay.items.filter(i => i.category === '交通').length;
            document.getElementById('stat-drive-time').innerText = driveItemsCount > 0 ? `約 ${driveItemsCount * 60} km` : '市區活動';

            // Fill Edit Mode input fields
            document.getElementById('edit-day-title-input').value = currentDay.title || '';
            document.getElementById('edit-day-hotel-input').value = currentDay.lodging || '';
        }

        // Update Day Metadata in Edit Mode
        function updateDayMetadata() {
            const currentDay = itineraryData.days[currentDayIndex];
            currentDay.title = document.getElementById('edit-day-title-input').value;
            currentDay.lodging = document.getElementById('edit-day-hotel-input').value;
            saveData();
            document.getElementById('current-day-title').innerText = `Day ${currentDay.dayNum}: ${currentDay.title}`;
            document.getElementById('stat-lodging').innerText = currentDay.lodging || '未指定住宿';
        }

        // Render Timeline Cards
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            const currentDay = itineraryData.days[currentDayIndex];
            if (!currentDay || !currentDay.items || currentDay.items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 bg-white rounded-2xl border border-slate-200/80 p-6">
                        <i class="fa-solid fa-map-location-dot text-4xl mb-3 text-slate-300"></i>
                        <p class="text-sm font-medium">今天尚未安排任何行程</p>
                        ${isEditMode ? '<button onclick="addNewActivity()" class="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">+ 新增第一項行程</button>' : ''}
                    </div>
                `;
                return;
            }

            // Filter items by category
            const filteredItems = currentDay.items.filter(item => {
                if (activeCategoryFilter === 'all') return true;
                return item.category === activeCategoryFilter;
            });

            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-400 bg-white rounded-2xl border border-slate-200/80">
                        <p class="text-xs">此分類（${activeCategoryFilter}）暫無行程項目</p>
                    </div>
                `;
                return;
            }

                const originalIndex = currentDay.items.indexOf(item);

                card.className = 'relative group transition-all';

                // Category badge styling map

                    card.innerHTML = `

                            <div class="flex items-center justify-between border-b border-amber-200/60 pb-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-black text-amber-800 bg-amber-200 px-2 py-0.5 rounded-md">

                                        <i class="fa-solid fa-arrow-up"></i>
                                    </button>
                                    <button onclick="moveActivity(${originalIndex}, 1)" ${originalIndex === currentDay.items.length - 1 ? 'disabled class="opacity-30 text-slate-400 p-1"' : 'class="p-1 hover:bg-amber-200 text-amber-800 rounded"'} title="下移">
                                        <i class="fa-solid fa-arrow-down"></i>
                                    </button>
                                    <button onclick="deleteActivity(${originalIndex})" class="p-1 hover:bg-rose-100 text-rose-600 rounded ml-2" title="刪除此項">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Inputs Grid -->
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">

                                    <input type="text" value="${escapeHtml(item.time || '')}" oninput="updateActivityField(${originalIndex}, 'time', this.value)" class="w-full text-xs p-2 rounded-xl border border-slate-300 font-mono">
                                </div>
                                <div>
                                    <label class="block text-[11px] text-slate-500 font-bold mb-0.5">分類 (Category)</label>
                                    <select onchange="updateActivityField(${originalIndex}, 'category', this.value)" class="w-full text-xs p-2 rounded-xl border border-slate-300">

                                <label class="block text-[11px] text-slate-500 font-bold mb-0.5">行程名稱 (Title)</label>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">

                            ${item.notes ? `<p class="text-xs text-slate-600 mb-3 bg-slate-50/80 p-2.5 rounded-xl border border-slate-100 leading-relaxed">${escapeHtml(item.notes)}</p>` : ''}

                            <!-- Action Buttons Row -->
                            <div class="flex items-center gap-2 pt-1 border-t border-slate-100">

                                    <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold transition-all flex items-center gap-1.5 border border-blue-200/60">

                    `;
                }

                container.appendChild(card);
            });

        // Toggle Edit Mode
        function setEditMode(enable) {
            isEditMode = enable;
            saveData();
            renderApp();
            showToast(isEditMode ? "已切換至「編輯 CMS 模式」" : "已切換至「瀏覽模式」");
        }

        function updateModeUI() {
            const btnView = document.getElementById('btn-view-mode');
            const btnEdit = document.getElementById('btn-edit-mode');
            const subtitle = document.getElementById('header-subtitle');
            const editControls = document.getElementById('edit-day-controls');
            const addItemBar = document.getElementById('add-item-bar');
            const fab = document.getElementById('fab-add');
            const catFilters = document.getElementById('category-filter-container');

            if (isEditMode) {
                btnView.className = 'px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-slate-400 hover:text-white flex items-center gap-1';
                btnEdit.className = 'px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-white bg-amber-600 shadow-sm flex items-center gap-1';
                subtitle.innerText = "編輯模式 (可即時修改)";
                document.getElementById('current-mode-badge').className = "inline-block w-2 h-2 rounded-full bg-amber-400 animate-ping";

                editControls.classList.remove('hidden');
                addItemBar.classList.remove('hidden');
                fab.classList.remove('hidden');
                catFilters.classList.add('hidden');
            } else {
                btnView.className = 'px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-white bg-slate-700 shadow-sm flex items-center gap-1';
                btnEdit.className = 'px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-slate-400 hover:text-white flex items-center gap-1';
                subtitle.innerText = "瀏覽模式 (唯讀)";
                document.getElementById('current-mode-badge').className = "inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse";

                editControls.classList.add('hidden');
                addItemBar.classList.add('hidden');
                fab.classList.add('hidden');
                catFilters.classList.remove('hidden');
            }
        }

        // Category Filter Function
        function setCategoryFilter(category) {
            activeCategoryFilter = category;
            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === category) {
                    btn.className = 'cat-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-800 text-white shadow-sm transition-all whitespace-nowrap';
                } else {
                    btn.className = 'cat-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap';
                }
            });
            renderTimeline();
        }

        // Add New Activity Item
        function addNewActivity() {
            const currentDay = itineraryData.days[currentDayIndex];
            const newItem = {
                id: Date.now().toString(),
                time: "12:00",
                category: "景點",
                title: "新行程項目",
                notes: "點擊此處輸入詳細說明或注意事項...",
                mapQuery: "",
                englishPhrase: "",
                estCost: 0
            };
            currentDay.items.push(newItem);
            saveData();
            renderApp();
            showToast("已新增一項行程！");
        }

        // Update Specific Field in Activity
        function updateActivityField(index, field, value) {
            const currentDay = itineraryData.days[currentDayIndex];
            if (currentDay && currentDay.items[index]) {
                currentDay.items[index][field] = value;
                saveData();
                renderDayHeader();
            }
        }

        // Move Activity Item Up / Down
        function moveActivity(index, direction) {
            const items = itineraryData.days[currentDayIndex].items;
            const targetIndex = index + direction;
            if (targetIndex >= 0 && targetIndex < items.length) {
                const temp = items[index];
                items[index] = items[targetIndex];
                items[targetIndex] = temp;
                saveData();
                renderTimeline();
            }
        }

        // Delete Activity Item
        function deleteActivity(index) {
            if (confirm("確定要刪除此項行程嗎？")) {
                itineraryData.days[currentDayIndex].items.splice(index, 1);
                saveData();
                renderApp();
                showToast("行程已刪除");
            }
        }

        // Add Entire New Day
        function addNewDay() {
            const newDayNum = itineraryData.days.length + 1;
            const newDay = {
                dayNum: newDayNum,
                title: `第 ${newDayNum} 天行程`,
                lodging: "自訂住宿地點",
                items: [
                    {
                        id: Date.now().toString(),
                        time: "09:00",
                        category: "景點",
                        title: "展開精彩一日探險",
                        notes: "在此輸入今天的行程概要",
                        mapQuery: "New Zealand",
                        englishPhrase: "Good morning!",
                        estCost: 0
                    }
                ]
            };
            itineraryData.days.push(newDay);
            currentDayIndex = itineraryData.days.length - 1;
            saveData();
            renderApp();
            showToast(`已新增 Day ${newDayNum}！`);
        }

        // Delete Entire Current Day
        function deleteCurrentDay() {
            if (itineraryData.days.length <= 1) {
                showToast("至少需保留一天行程！", true);
                return;
            }
            if (confirm(`確定要刪除整個 Day ${itineraryData.days[currentDayIndex].dayNum} 嗎？`)) {
                itineraryData.days.splice(currentDayIndex, 1);
                // Re-index day numbers
                itineraryData.days.forEach((day, i) => {
                    day.dayNum = i + 1;
                });
                currentDayIndex = Math.max(0, currentDayIndex - 1);
                saveData();
                renderApp();
                showToast("已刪除該天數");
            }
        }

        // Popover Data Menu Toggle
        function toggleDataMenu() {
            const menu = document.getElementById('data-menu');
            menu.classList.toggle('hidden');
        }

        // Export JSON File
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(itineraryData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `NewZealand_Itinerary_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast("已成功匯出 JSON 備份檔！");
        }

        // Import JSON File
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && Array.isArray(parsed.days)) {
                        itineraryData = parsed;
                        currentDayIndex = 0;
                        saveData();
                        renderApp();
                        showToast("成功匯入行程檔案！");
                    } else {
                        showToast("JSON 格式不符！", true);
                    }
                } catch (err) {
                    showToast("檔案讀取失敗，請確認為合法 JSON", true);
                }
            };
            reader.readAsText(file);
        }

        // English Modal Controls
        let currentModalPhrase = '';

        function openPhraseModal(cnContext, phrase) {
            currentModalPhrase = phrase;
            document.getElementById('phrase-modal-cn').innerText = `💡 使用情境: ${cnContext}`;
            document.getElementById('phrase-modal-en').innerText = `"${phrase}"`;
            document.getElementById('phrase-modal').classList.remove('hidden');
        }

        function closePhraseModal() {
            document.getElementById('phrase-modal').classList.add('hidden');
        }

        function speakPhrase() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(currentModalPhrase);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // Slightly slower for clarity
                window.speechSynthesis.speak(utterance);
                showToast("🔊 正在朗讀...");
            } else {
                showToast("您的瀏覽器不支援語音朗讀功能", true);
            }
        }

        function copyPhraseText() {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(currentModalPhrase).then(() => {
                    showToast("已複製對話英文至剪貼簿！");
                }).catch(() => {
                    fallbackCopyText(currentModalPhrase);
                });
            } else {
                fallbackCopyText(currentModalPhrase);
            }
        }

        function fallbackCopyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast("已複製對話英文至剪貼簿！");
        }

        // Toast Helper
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toast-msg');
            const icon = document.getElementById('toast-icon');

            msgSpan.innerText = msg;
            if (isError) {
                icon.className = "fa-solid fa-circle-exclamation text-rose-400";
            } else {
                icon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Escape HTML Helper
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
